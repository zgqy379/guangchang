<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>逛厂 · 片尾</title>
<style>
  :root { --delta: 0s; --bg: #070b13; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: #f6f8fc; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url('../../../figures/street-2026-10-27-polish9/night/walk.png') center/cover no-repeat; transform: scale(1.02); animation: kb 9s linear forwards; }
  @keyframes kb { to { transform: scale(1.09); } }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,8,14,.94) 0%, rgba(5,8,14,.72) 48%, rgba(5,8,14,.3) 100%), linear-gradient(0deg, rgba(5,8,14,.9), transparent 45%); }
  .inner { position: absolute; left: 84px; top: 150px; max-width: 860px; }
  .brand { font-size: 76px; font-weight: 800; letter-spacing: 6px; }
  .slogan { font-size: 34px; color: #ffd24a; letter-spacing: 4px; margin-top: 12px; }
  .sub { font-size: 21px; color: #aebbd0; letter-spacing: 2px; margin-top: 18px; }
  .links { margin-top: 46px; display: flex; flex-direction: column; gap: 12px; font-size: 21px; color: #c7d2e2; letter-spacing: 1px; }
  .links b { color: #8fa0b8; font-weight: 400; display: inline-block; width: 150px; margin-right: 8px; }
  .team { position: absolute; left: 84px; bottom: 58px; font-size: 18px; color: #8fa0b8; letter-spacing: 1px; }
  .anim { opacity: 0; transform: translateY(18px); }
  body.playing .anim { animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d,0s) - var(--delta)); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  #veil { position: fixed; inset: 0; background: var(--bg); z-index: 99; pointer-events: none; opacity: 1; transition: opacity 1s ease 1s; }
  body.playing #veil { opacity: 0; }
  .dv-cursor { display: none !important; }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="scrim"></div>
    <div class="inner">
      <div class="brand anim" style="--d:.2s">逛厂 GuǎngChǎng</div>
      <div class="slogan anim" style="--d:.7s">把画的饼，砌成真的山</div>
      <div class="sub anim" style="--d:1.3s">参数空间化 3D 求职招聘街区</div>
      <div class="links">
        <div class="anim" style="--d:1.8s"><b>在线 Demo</b>zgqy379.github.io/guangchang</div>
        <div class="anim" style="--d:2.3s"><b>魔搭创空间</b>modelscope.cn/studios/zgqy379/guangchang3d</div>
        <div class="anim" style="--d:2.8s"><b>源代码</b>github.com/zgqy379/guangchang</div>
      </div>
    </div>
    <div class="team anim" style="--d:3.6s">群核科技 Aholo 全球 3D AI 黑客松 · 必胜客的汉堡最好吃（3FO4K4VY3D07 · 单人队） · 所有数据为演示样例</div>
  </div>
  <div id="veil"></div>
</body>
</html>
