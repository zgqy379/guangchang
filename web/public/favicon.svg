    <rect x="14" y="42" width="36" height="7" rx="1.5"/>
    <rect x="17" y="34" width="30" height="7" rx="1.5"/>
    <rect x="20" y="26" width="24" height="7" rx="1.5"/>
    <rect x="23" y="18" width="18" height="7" rx="1.5"/>
  </g>
  <!-- 顶端品牌红：山尖（稀有度 S 章） -->
  <circle cx="32" cy="12" r="4.5" fill="#ff5a3c"/>
